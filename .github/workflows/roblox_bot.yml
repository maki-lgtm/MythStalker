name: Roblox Bot
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Needed so the bot can commit the updated state.json back to the repo.
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GAME_WATCH_ACCOUNTS: ${{ secrets.GAME_WATCH_ACCOUNTS }}
          BADGE_WATCH_GAMES: ${{ secrets.BADGE_WATCH_GAMES }}
          GROUP_RANK_WATCH: ${{ secrets.GROUP_RANK_WATCH }}
          ONLINE_WATCH_USERS: ${{ secrets.ONLINE_WATCH_USERS }}
        run: python bot.py

      # This replaces the old actions/cache restore+save steps entirely.
      # Committing state.json back to the repo is what makes state persist
      # correctly between hourly runs -- no stale/frozen cache possible.
      - name: Commit updated state
        run: |
          git config user.name "myth-hunting-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update state"
          git push
